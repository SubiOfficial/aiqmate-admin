databases:
  - name: aiqmate-db
    plan: free
    databaseName: aiqmate
    user: aiqmate

services:
  - type: web
    name: aiqmate-admin
    runtime: node
    plan: free
    rootDir: AIQMate_Web
    buildCommand: npm install && npm run build:render && npx prisma db push --skip-generate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: aiqmate-db
          property: connectionString
